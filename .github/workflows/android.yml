name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NoDoomScroll.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoDoomScroll-apk
          path: NoDoomScroll.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: NoDoomScroll for Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: NoDoomScroll.apk
          body: |
            Download **NoDoomScroll.apk** below on your Android phone and open it to install.
            Setup steps are in the README.
