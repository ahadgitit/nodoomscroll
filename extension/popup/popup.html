<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NoDoomScroll</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="32" height="32">
    <h1>NoDoomScroll</h1>
  </header>

  <label class="row">
    <span>
      <strong>Block Shorts</strong>
      <small>Hide Shorts shelves, tabs, chips and suggestions</small>
    </span>
    <input type="checkbox" id="enabled">
  </label>

  <label class="row">
    <span>
      <strong>Open Shorts as normal videos</strong>
      <small>Shorts links play in the regular player, no endless swiping</small>
    </span>
    <input type="checkbox" id="redirect">
  </label>

  <p class="note">Changes apply to open YouTube tabs right away.</p>
  <script src="popup.js"></script>
</body>
</html>
